<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Prompt, Sarabun, Tahoma, sans-serif"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#1e293b"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="64" rx="0" fill="#0c3b6e" stroke="none" stroke-width="2"/><text x="28" y="41" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start">ความเร็วรอบมอเตอร์เหนี่ยวนำเมื่อปรับความถี่ด้วย Inverter (4 ขั้ว)</text><text x="1172" y="41" font-size="16" fill="#cfe3f3" font-weight="400" text-anchor="end">หน่วยที่ 8</text><line x1="160" y1="460" x2="940" y2="460" stroke="#1e293b" stroke-width="3" marker-end="url(#ah)"/><line x1="160" y1="460" x2="160" y2="110" stroke="#1e293b" stroke-width="3" marker-end="url(#ah)"/><line x1="160" y1="460" x2="920" y2="130" stroke="#1769aa" stroke-width="4"/><circle cx="312.0" cy="394.0" r="6" fill="#1769aa" stroke="#1769aa" stroke-width="2"/><text x="312.0" y="488" font-size="15" fill="#1e293b" font-weight="400" text-anchor="middle">10 Hz</text><text x="302.0" y="380.0" font-size="15" fill="#1769aa" font-weight="600" text-anchor="end">300</text><circle cx="464.0" cy="328.0" r="6" fill="#1769aa" stroke="#1769aa" stroke-width="2"/><text x="464.0" y="488" font-size="15" fill="#1e293b" font-weight="400" text-anchor="middle">20 Hz</text><text x="454.0" y="314.0" font-size="15" fill="#1769aa" font-weight="600" text-anchor="end">600</text><circle cx="616.0" cy="262.0" r="6" fill="#1769aa" stroke="#1769aa" stroke-width="2"/><text x="616.0" y="488" font-size="15" fill="#1e293b" font-weight="400" text-anchor="middle">30 Hz</text><text x="606.0" y="248.0" font-size="15" fill="#1769aa" font-weight="600" text-anchor="end">900</text><circle cx="768.0" cy="196.0" r="6" fill="#1769aa" stroke="#1769aa" stroke-width="2"/><text x="768.0" y="488" font-size="15" fill="#1e293b" font-weight="400" text-anchor="middle">40 Hz</text><text x="758.0" y="182.0" font-size="15" fill="#1769aa" font-weight="600" text-anchor="end">1200</text><circle cx="920.0" cy="130.0" r="6" fill="#1769aa" stroke="#1769aa" stroke-width="2"/><text x="920.0" y="488" font-size="15" fill="#1e293b" font-weight="400" text-anchor="middle">50 Hz</text><text x="910.0" y="116.0" font-size="15" fill="#1769aa" font-weight="600" text-anchor="end">1500</text><text x="540.0" y="522" font-size="17" fill="#1e293b" font-weight="600" text-anchor="middle">ความถี่ที่ Inverter จ่าย</text><text x="150" y="100" font-size="17" fill="#1e293b" font-weight="600" text-anchor="start">รอบซิงโครนัส (rpm)</text><rect x="950" y="150" width="220" height="220" rx="12" fill="#e8f1fb" stroke="#1769aa" stroke-width="2"/><text x="1060.0" y="206.0" font-size="21" fill="#1769aa" font-weight="600" text-anchor="middle">Ns = 120 f / P</text><text x="1060.0" y="233.3" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">P = จำนวนขั้ว</text><text x="1060.0" y="256.5" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle"></text><text x="1060.0" y="279.7" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">50 Hz → 1,500 rpm</text><text x="1060.0" y="302.9" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">30 Hz → 900 rpm</text><text x="1060.0" y="326.1" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">สลิป 4% → 864 rpm</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Prompt, Sarabun, Tahoma, sans-serif"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#1e293b"/></marker></defs><rect x="0" y="0" width="1200" height="580" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="64" rx="0" fill="#0c3b6e" stroke="none" stroke-width="2"/><text x="28" y="41" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start">การสเกลค่าอนาล็อกเพื่อแสดงบน Numerical Display</text><text x="1172" y="41" font-size="16" fill="#cfe3f3" font-weight="400" text-anchor="end">หน่วยที่ 6</text><line x1="140" y1="470" x2="780" y2="470" stroke="#1e293b" stroke-width="3" marker-end="url(#ah)"/><line x1="140" y1="470" x2="140" y2="90" stroke="#1e293b" stroke-width="3" marker-end="url(#ah)"/><line x1="140" y1="470" x2="760" y2="110" stroke="#1769aa" stroke-width="4"/><line x1="527.5" y1="470" x2="527.5" y2="245.0" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 6"/><line x1="140" y1="245.0" x2="527.5" y2="245.0" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 6"/><circle cx="527.5" cy="245.0" r="8" fill="#c2410c" stroke="#c2410c" stroke-width="2"/><text x="527.5" y="500" font-size="17" fill="#c2410c" font-weight="700" text-anchor="middle">2500</text><text x="128" y="251.0" font-size="17" fill="#c2410c" font-weight="700" text-anchor="end">62.5</text><text x="760" y="500" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">4000</text><text x="128" y="116" font-size="16" fill="#1e293b" font-weight="400" text-anchor="end">100.0</text><text x="450.0" y="532" font-size="17" fill="#1e293b" font-weight="600" text-anchor="middle">ค่าดิบจากโมดูลอนาล็อก (D100)</text><text x="70" y="80" font-size="17" fill="#1e293b" font-weight="600" text-anchor="start">อุณหภูมิ °C</text><rect x="820" y="140" width="340" height="330" rx="12" fill="#e8f1fb" stroke="#1769aa" stroke-width="2"/><text x="990.0" y="221.75" font-size="20" fill="#1769aa" font-weight="600" text-anchor="middle">สูตรสเกลเชิงเส้น</text><text x="990.0" y="247.75" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">ค่าจริง = ค่าดิบ × (100 − 0)</text><text x="990.0" y="272.4" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">             ÷ (4000 − 0)</text><text x="990.0" y="297.05" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle"></text><text x="990.0" y="321.7" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">2500 × 100 ÷ 4000 = 62.5 °C</text><text x="990.0" y="346.35" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle"></text><text x="990.0" y="371.0" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">เก็บใน D110 = 625</text><text x="990.0" y="395.65" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">ตั้ง Decimal = 1 → แสดง 62.5</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Prompt, Sarabun, Tahoma, sans-serif"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#1e293b"/></marker></defs><rect x="0" y="0" width="1200" height="520" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="64" rx="0" fill="#0c3b6e" stroke="none" stroke-width="2"/><text x="28" y="41" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start">ความพร้อมใช้งานของระบบ (Availability) จาก MTBF และ MTTR</text><text x="1172" y="41" font-size="16" fill="#cfe3f3" font-weight="400" text-anchor="end">หน่วยที่ 10</text><rect x="80" y="150" width="760" height="70" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="2"/><text x="460" y="195" font-size="20" fill="#15803d" font-weight="700" text-anchor="middle">ทำงานได้ปกติ  MTBF = 2,000 ชั่วโมง</text><rect x="840" y="150" width="120" height="70" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-width="2"/><text x="900" y="195" font-size="17" fill="#b91c1c" font-weight="700" text-anchor="middle">MTTR 4 h</text><text x="1000" y="195" font-size="17" fill="#64748b" font-weight="600" text-anchor="start">→ วนซ้ำ</text><rect x="230" y="280" width="740" height="150" rx="12" fill="#e8f1fb" stroke="#1769aa" stroke-width="2"/><text x="600.0" y="334.0" font-size="22" fill="#1769aa" font-weight="600" text-anchor="middle">Availability = MTBF ÷ (MTBF + MTTR)</text><text x="600.0" y="362.6" font-size="18" fill="#1e293b" font-weight="400" text-anchor="middle">= 2,000 ÷ (2,000 + 4) = 0.998  →  99.80 %</text><text x="600.0" y="388.70000000000005" font-size="18" fill="#1e293b" font-weight="400" text-anchor="middle">ลด MTTR ด้วยอะไหล่สำรอง + สำรองโปรแกรม (Backup) + ผังค้นหาสาเหตุ</text></svg>
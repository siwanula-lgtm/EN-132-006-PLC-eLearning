<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Prompt, Sarabun, Tahoma, sans-serif"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#1e293b"/></marker></defs><rect x="0" y="0" width="1200" height="520" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="64" rx="0" fill="#0c3b6e" stroke="none" stroke-width="2"/><text x="28" y="41" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start">ขั้นตอนใช้งาน GX Works3 ตั้งแต่สร้างโปรเจกต์จนถึง Monitor</text><text x="1172" y="41" font-size="16" fill="#cfe3f3" font-weight="400" text-anchor="end">หน่วยที่ 3</text><rect x="30" y="150" width="170" height="200" rx="12" fill="#e8f1fb" stroke="#1769aa" stroke-width="2"/><text x="115.0" y="232.0" font-size="19" fill="#1769aa" font-weight="600" text-anchor="middle">New Project</text><text x="115.0" y="256.7" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">Series: FX5CPU</text><text x="115.0" y="279.9" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">Type: FX5U</text><circle cx="115" cy="150" r="22" fill="#0c3b6e" stroke="#0c3b6e" stroke-width="2"/><text x="115" y="158" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">1</text><line x1="200" y1="250" x2="223" y2="250" stroke="#1e293b" stroke-width="3" marker-end="url(#ah)"/><rect x="225" y="150" width="170" height="200" rx="12" fill="#e0f5f9" stroke="#0891b2" stroke-width="2"/><text x="310.0" y="232.0" font-size="19" fill="#0891b2" font-weight="600" text-anchor="middle">เขียน Ladder</text><text x="310.0" y="256.7" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">วาดหน้าสัมผัส</text><text x="310.0" y="279.9" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">และคอยล์</text><circle cx="310" cy="150" r="22" fill="#0c3b6e" stroke="#0c3b6e" stroke-width="2"/><text x="310" y="158" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">2</text><line x1="395" y1="250" x2="418" y2="250" stroke="#1e293b" stroke-width="3" marker-end="url(#ah)"/><rect x="420" y="150" width="170" height="200" rx="12" fill="#e8f1fb" stroke="#1769aa" stroke-width="2"/><text x="505.0" y="232.0" font-size="19" fill="#1769aa" font-weight="600" text-anchor="middle">Convert</text><text x="505.0" y="256.7" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">กด F4</text><text x="505.0" y="279.9" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">ตรวจไวยากรณ์</text><circle cx="505" cy="150" r="22" fill="#0c3b6e" stroke="#0c3b6e" stroke-width="2"/><text x="505" y="158" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">3</text><line x1="590" y1="250" x2="613" y2="250" stroke="#1e293b" stroke-width="3" marker-end="url(#ah)"/><rect x="615" y="150" width="170" height="200" rx="12" fill="#e0f5f9" stroke="#0891b2" stroke-width="2"/><text x="700.0" y="232.0" font-size="19" fill="#0891b2" font-weight="600" text-anchor="middle">เชื่อมต่อ</text><text x="700.0" y="256.7" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">Ethernet / USB</text><text x="700.0" y="279.9" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">Connection Test</text><circle cx="700" cy="150" r="22" fill="#0c3b6e" stroke="#0c3b6e" stroke-width="2"/><text x="700" y="158" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">4</text><line x1="785" y1="250" x2="808" y2="250" stroke="#1e293b" stroke-width="3" marker-end="url(#ah)"/><rect x="810" y="150" width="170" height="200" rx="12" fill="#e8f1fb" stroke="#1769aa" stroke-width="2"/><text x="895.0" y="232.0" font-size="19" fill="#1769aa" font-weight="600" text-anchor="middle">Write to PLC</text><text x="895.0" y="256.7" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">เขียนโปรแกรม</text><text x="895.0" y="279.9" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">+ พารามิเตอร์</text><circle cx="895" cy="150" r="22" fill="#0c3b6e" stroke="#0c3b6e" stroke-width="2"/><text x="895" y="158" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">5</text><line x1="980" y1="250" x2="1003" y2="250" stroke="#1e293b" stroke-width="3" marker-end="url(#ah)"/><rect x="1005" y="150" width="170" height="200" rx="12" fill="#e0f5f9" stroke="#0891b2" stroke-width="2"/><text x="1090.0" y="232.0" font-size="19" fill="#0891b2" font-weight="600" text-anchor="middle">RUN + Monitor</text><text x="1090.0" y="256.7" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">สวิตช์ RUN</text><text x="1090.0" y="279.9" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">Monitor F3</text><circle cx="1090" cy="150" r="22" fill="#0c3b6e" stroke="#0c3b6e" stroke-width="2"/><text x="1090" y="158" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">6</text><rect x="190.0" y="403" width="820" height="30.6" rx="17" fill="#c2410c" stroke="none" stroke-width="2"/><text x="600" y="425.95" font-size="17" fill="#fff" font-weight="600" text-anchor="middle">แก้โปรแกรมขณะ Monitor: เปลี่ยนเป็น Edit → แก้ไข → Convert (F4) → Write ใหม่</text><text x="600.0" y="504" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">ทุกครั้งที่แก้ Ladder ต้อง Convert ก่อน มิฉะนั้นจะ Write to PLC ไม่ได้</text></svg>
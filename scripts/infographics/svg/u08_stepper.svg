<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Prompt, Sarabun, Tahoma, sans-serif"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#1e293b"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="64" rx="0" fill="#0c3b6e" stroke="none" stroke-width="2"/><text x="28" y="41" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start">การสั่ง Stepper Motor ด้วยพัลส์ (Pulse / Direction)</text><text x="1172" y="41" font-size="16" fill="#cfe3f3" font-weight="400" text-anchor="end">หน่วยที่ 8</text><polyline points="230,170 262.0,170 262.0,170 262.0,120 294.0,120 294.0,120 294.0,170 326.0,170 326.0,170 326.0,120 358.0,120 358.0,120 358.0,170 390.0,170 390.0,170 390.0,120 422.0,120 422.0,120 422.0,170 454.0,170 454.0,170 454.0,120 486.0,120 486.0,120 486.0,170 518.0,170 518.0,170 518.0,120 550.0,120 550.0,120 550.0,170 582.0,170 582.0,170 582.0,120 614.0,120 614.0,120 614.0,170 646.0,170 646.0,170 646.0,120 678.0,120 678.0,120 678.0,170 710.0,170 710.0,170 710.0,120 742.0,120 742.0,120 742.0,170 774.0,170 774.0,170 774.0,120 806.0,120 806.0,120 806.0,170 838.0,170 870.0,170" fill="none" stroke="#1769aa" stroke-width="3" stroke-linejoin="round"/><text x="214" y="151.0" font-size="18" fill="#1e293b" font-weight="600" text-anchor="end">PULSE (Y0)</text><polyline points="230,290 262.0,290 262.0,290 262.0,240 870.0,240" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/><text x="214" y="271.0" font-size="18" fill="#1e293b" font-weight="600" text-anchor="end">DIR (Y2)</text><text x="550" y="340" font-size="17" fill="#1e293b" font-weight="600" text-anchor="middle">จำนวนพัลส์ = ระยะ/มุมที่หมุน   |   ความถี่พัลส์ = ความเร็ว</text><rect x="900" y="110" width="270" height="250" rx="12" fill="#e8f1fb" stroke="#1769aa" stroke-width="2"/><text x="1035.0" y="181.0" font-size="20" fill="#1769aa" font-weight="600" text-anchor="middle">สูตรสำคัญ</text><text x="1035.0" y="207.0" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">พัลส์/รอบ = 360° ÷ มุมสเต็ป</text><text x="1035.0" y="230.2" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">              × ไมโครสเต็ป</text><text x="1035.0" y="253.4" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle"></text><text x="1035.0" y="276.6" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">ความถี่ (Hz) =</text><text x="1035.0" y="299.8" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle">rpm ÷ 60 × พัลส์/รอบ</text><rect x="220.0" y="402" width="760" height="32.4" rx="18" fill="#0c3b6e" stroke="none" stroke-width="2"/><text x="600" y="426.3" font-size="18" fill="#fff" font-weight="600" text-anchor="middle">1.8° × 1/8 สเต็ป → 1,600 พัลส์/รอบ   |   120 rpm → 3,200 Hz</text><text x="600.0" y="544" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">FX5U ใช้คำสั่งกำหนดตำแหน่ง เช่น DRVI/DRVA ส่งพัลส์ออกทางเอาต์พุตทรานซิสเตอร์ (Y0–Y3)</text></svg>
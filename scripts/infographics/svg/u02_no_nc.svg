<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Prompt, Sarabun, Tahoma, sans-serif"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#1e293b"/></marker></defs><rect x="0" y="0" width="1200" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="64" rx="0" fill="#0c3b6e" stroke="none" stroke-width="2"/><text x="28" y="41" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start">หน้าสัมผัส NO / NC กับสถานะใน Ladder</text><text x="1172" y="41" font-size="16" fill="#cfe3f3" font-weight="400" text-anchor="end">หน่วยที่ 2</text><text x="150" y="130" font-size="20" fill="#0c3b6e" font-weight="700" text-anchor="middle"></text><text x="450" y="130" font-size="20" fill="#0c3b6e" font-weight="700" text-anchor="middle">ไม่กดปุ่ม (ปกติ)</text><text x="720" y="130" font-size="20" fill="#0c3b6e" font-weight="700" text-anchor="middle">กดปุ่ม</text><text x="1000" y="130" font-size="20" fill="#0c3b6e" font-weight="700" text-anchor="middle">ใช้กับงาน</text><rect x="40" y="170" width="1120" height="150" rx="12" fill="#e8f1fb" stroke="#1769aa" stroke-width="2"/><text x="150" y="240" font-size="30" fill="#1769aa" font-weight="700" text-anchor="middle">NO</text><text x="150" y="274" font-size="15" fill="#1769aa" font-weight="400" text-anchor="middle">(Normally Open)</text><text x="450" y="254.0" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">วงจรเปิด → X0 = OFF</text><text x="720" y="254.0" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">วงจรปิด → X0 = ON</text><text x="1000" y="254.0" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">ปุ่ม Start, เซนเซอร์ตรวจจับ</text><rect x="40" y="350" width="1120" height="150" rx="12" fill="#fde8e8" stroke="#b91c1c" stroke-width="2"/><text x="150" y="420" font-size="30" fill="#b91c1c" font-weight="700" text-anchor="middle">NC</text><text x="150" y="454" font-size="15" fill="#b91c1c" font-weight="400" text-anchor="middle">(Normally Closed)</text><text x="450" y="434.0" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">วงจรปิด → X1 = ON</text><text x="720" y="434.0" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">วงจรเปิด → X1 = OFF</text><text x="1000" y="434.0" font-size="17" fill="#1e293b" font-weight="400" text-anchor="middle">ปุ่ม Stop, Emergency</text><rect x="150.0" y="529" width="900" height="28.8" rx="16" fill="#c2410c" stroke="none" stroke-width="2"/><text x="600" y="550.6" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">ปุ่ม Stop ใช้ NC เพื่อความปลอดภัย: ถ้าสายขาด PLC จะเห็นเป็นการกด Stop ทันที (Fail-safe)</text></svg>
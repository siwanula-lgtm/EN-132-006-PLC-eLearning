<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Prompt, Sarabun, Tahoma, sans-serif"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#1e293b"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1200" height="64" rx="0" fill="#0c3b6e" stroke="none" stroke-width="2"/><text x="28" y="41" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start">เปรียบเทียบ RS-232 และ RS-485</text><text x="1172" y="41" font-size="16" fill="#cfe3f3" font-weight="400" text-anchor="end">หน่วยที่ 7</text><rect x="40" y="90" width="540" height="410" rx="12" fill="#e8f1fb" stroke="#1769aa" stroke-width="2"/><text x="310" y="130" font-size="24" fill="#1769aa" font-weight="700" text-anchor="middle">RS-232 (จุดต่อจุด)</text><rect x="80" y="190" width="160" height="90" rx="12" fill="#fff" stroke="#1769aa" stroke-width="2"/><text x="160.0" y="241.0" font-size="20" fill="#1769aa" font-weight="600" text-anchor="middle">PC</text><rect x="380" y="190" width="160" height="90" rx="12" fill="#fff" stroke="#1769aa" stroke-width="2"/><text x="460.0" y="241.0" font-size="20" fill="#1769aa" font-weight="600" text-anchor="middle">PLC</text><line x1="240" y1="220" x2="380" y2="220" stroke="#1769aa" stroke-width="3" marker-end="url(#ah)"/><line x1="380" y1="252" x2="244" y2="252" stroke="#1769aa" stroke-width="3"/><text x="310" y="212" font-size="14" fill="#1769aa" font-weight="400" text-anchor="middle">TX → RX</text><text x="310" y="350.0" font-size="18" fill="#1e293b" font-weight="400" text-anchor="middle">1 : 1 เท่านั้น</text><text x="310" y="376.1" font-size="18" fill="#1e293b" font-weight="400" text-anchor="middle">ระยะ ≈ 15 m</text><text x="310" y="402.2" font-size="18" fill="#1e293b" font-weight="400" text-anchor="middle">สัญญาณอ้างอิงกราวด์ (Single-ended)</text><rect x="620" y="90" width="540" height="410" rx="12" fill="#fdeee4" stroke="#c2410c" stroke-width="2"/><text x="890" y="130" font-size="24" fill="#c2410c" font-weight="700" text-anchor="middle">RS-485 (หลายจุด)</text><line x1="660" y1="230" x2="1120" y2="230" stroke="#c2410c" stroke-width="4"/><line x1="660" y1="260" x2="1120" y2="260" stroke="#c2410c" stroke-width="4"/><text x="645" y="236" font-size="16" fill="#c2410c" font-weight="700" text-anchor="end">A</text><text x="645" y="266" font-size="16" fill="#c2410c" font-weight="700" text-anchor="end">B</text><rect x="690" y="160" width="90" height="50" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="735.0" y="191.0" font-size="14" fill="#c2410c" font-weight="600" text-anchor="middle">Master</text><line x1="735" y1="210" x2="735" y2="260" stroke="#c2410c" stroke-width="2"/><rect x="800" y="160" width="90" height="50" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="845.0" y="191.0" font-size="14" fill="#c2410c" font-weight="600" text-anchor="middle">Slave 1</text><line x1="845" y1="210" x2="845" y2="260" stroke="#c2410c" stroke-width="2"/><rect x="910" y="160" width="90" height="50" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="955.0" y="191.0" font-size="14" fill="#c2410c" font-weight="600" text-anchor="middle">Slave 2</text><line x1="955" y1="210" x2="955" y2="260" stroke="#c2410c" stroke-width="2"/><rect x="1020" y="160" width="90" height="50" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="1065.0" y="191.0" font-size="14" fill="#c2410c" font-weight="600" text-anchor="middle">Slave 3</text><line x1="1065" y1="210" x2="1065" y2="260" stroke="#c2410c" stroke-width="2"/><rect x="1110" y="222" width="30" height="46" rx="4" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="1125" y="292" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle">120Ω</text><text x="890" y="350.0" font-size="18" fill="#1e293b" font-weight="400" text-anchor="middle">สูงสุด 32 อุปกรณ์ต่อบัส</text><text x="890" y="376.1" font-size="18" fill="#1e293b" font-weight="400" text-anchor="middle">ระยะ ≈ 1,200 m</text><text x="890" y="402.2" font-size="18" fill="#1e293b" font-weight="400" text-anchor="middle">แบบดิฟเฟอเรนเชียล ทนสัญญาณรบกวน</text><text x="600.0" y="544" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">ใช้สายคู่บิดเกลียว (Twisted pair) และต่อตัวต้านทาน 120 Ω ที่ปลายบัสทั้งสองด้าน</text></svg>